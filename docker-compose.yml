services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: basecamp
      POSTGRES_PASSWORD: basecamp
      POSTGRES_DB: basecamp
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basecamp -d basecamp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports:
      - "9000:9000"
      - "9002:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
